<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skipstone</title>
<style>
  :root { color-scheme: dark; --bg:#0b1020; --card:#131a30; --ink:#e8eefc; --dim:#9fb0d0; --line:#24304f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:32rem; width:100%; text-align:center; }
  h1 { font-size:2rem; margin:0 0 .3rem; letter-spacing:-.02em; }
  p.sub { color:var(--dim); margin:0 0 2rem; }
  .links { display:grid; gap:.75rem; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px;
           padding:1rem 1.25rem; color:var(--ink); text-decoration:none; text-align:left; }
  a.card:hover { border-color:#3c5080; }
  a.card strong { display:block; }
  a.card span { color:var(--dim); font-size:.9rem; }
  footer { color:var(--dim); font-size:.85rem; margin-top:2rem; }
</style>
</head>
<body>
<main>
  <h1>Skipstone</h1>
  <p class="sub">Skip a stone across the lake.</p>
  <div class="links">
    <a class="card" href="https://rburns02.github.io/skipstone-support-/download.html"><strong>Download</strong><span>Get Skipstone on the App Store</span></a>
    <a class="card" href="https://rburns02.github.io/skipstone-support-/support.html"><strong>Support</strong><span>Common questions and how to get help</span></a>
    <a class="card" href="https://rburns02.github.io/skipstone-support-/privacy.html"><strong>Privacy Policy</strong><span>What the app stores, and what it does not</span></a>
  </div>
  <footer>robbiemmiller12345@gmail.com</footer>
</main>
</body>
</html>
